name: Build AxionOS for lavender

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32ncurses-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Sync AxionOS
        run: |
          mkdir ~/axion
          cd ~/axion
          git config --global user.name "Ayan"
          git config --global user.email "your-email@example.com"
          repo init -u https://github.com/AxionAOSP/android.git -b lineage-23.2 --git-lfs
          repo sync -c -j4 --no-tags --no-clone-bundle

      - name: Clone lavender sources
        run: |
          cd ~/axion
          git clone https://github.com/AxionAOSP-devices/android_device_xiaomi_lavender -b lineage-23.2 device/xiaomi/lavender
          git clone https://github.com/AxionAOSP-devices/android_vendor_xiaomi_lavender -b lineage-23.2 vendor/xiaomi/lavender
          git clone https://github.com/AxionAOSP-devices/android_kernel_xiaomi_lavender -b lineage-23.2 kernel/xiaomi/lavender

      - name: Build AxionOS
        run: |
          cd ~/axion
          . build/envsetup.sh
          gk -s
          axion lavender gms
          ax -br -j4

      - name: Upload ROM ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AxionOS-lavender-Ayan
          path: |
            out/target/product/lavender/*.zip
